# amplicon-seq-workflow config: East River NEON-style soil survey, 16S V4 + ITS1, 2018 (ER18) + 2022 (ER22)
# sampling, analyzed together per locus (2x300 MiSeq M02248 runs: 16S JL579 / LHM22 / Reyes redos,
# ITS JL4PT / LHT2N / LL6BT).
#
# fastq files come from per-locus manifests (samples.manifest) built from NEON_ER_amplicon_fastq_lookup.tsv:
# one line per sample, absolute Perlmutter paths, usable libraries only. Sample names: NNN-ER18 (2018),
# NNN-ER22 (2022), A/B technical replicates as NNN-ER18_A / _B (same site and covariates).
# The metadata (NEON_ER_amplicon_metadata.tsv) has one row per sample of either locus:
# sample, SampleSiteCode (NNN-ER18 for both years: the site key for joining soil chemistry), year, replicate,
# run_16S, run_ITS.
#
# No community analysis yet (no `analysis` section): run the steps up to phyloseq, e.g.
#   ./workflow.py run -c config/neon-ER18-ER22.yaml --steps reference,dada2,tree,phyloseq --slurm
#
# Strings may use {placeholders}: any key under `vars` (after the profile's vars are merged in), plus
# {project}, {run}, {run_id}, {locus}, {key} and {repo} (this repository's folder).

project: neon_er
run: ER18_ER22
run_id: ER18_ER22
loci: [16S, ITS]

key: "{project}_{run_id}.{locus}"      # R1-only runs (merge: false) get ".R1" appended

# ---- where things are: the data are on Perlmutter only ----
profiles:
  nersc:
    detect: /global/homes
    vars:
      base: /global/cfs/cdirs/m3523/ertraits/ersynthesis/data/neon_itag
      refdir: /global/homes/u/ukaraoz/m3260/refdata
      scratch: /pscratch/sd/u/ukaraoz/neon_itag
      mothur_ref: "{refdir}/mothur/silva.nr_v138_2"

paths:
  metadata: "{base}/NEON_ER_amplicon_metadata.tsv"
  work: "{scratch}/{locus}/work/{run}"   # cutadapt + filtered reads (regenerable; pscratch is purged)
  results: "{repo}/results/{key}"        # DADA2 outputs (tables, fasta, phyloseq), one folder per key in the repo
  analysis: "{repo}/results/{key}/analysis"

# ---- where the workflow runs: `workflow.py pull` copies results/<key>/ from this clone ----
remote:
  host: perlmutter.nersc.gov
  repo: /global/cfs/cdirs/m3523/ertraits/ersynthesis/amplicon-seq-workflow
  profile: nersc

# ---- samples ----
samples:
  id_column: sample
  manifest: "{base}/NEON_ER_{locus}_manifest.tsv"   # columns sample, R1, R2 (+ SampleSiteCode, year, replicate, run_folder)
  # sequencing run of each sample (manifest column): each run gets its own filtering settings (locus_settings.<locus>.runs),
  # error models and denoising; the run tables are combined before chimera removal and taxonomy
  run_column: run_folder
  label_strip: null

# ---- DADA2 (dada2-asv.R); per-locus settings override `dada2` ----
dada2:
  mincount: 1000      # samples with fewer filtered reads are dropped before denoising
  minfinal: 5000      # samples with fewer reads in the final table are reported as failed
  minLen: 50
  minOverlap: 12
  threads: 8          # dada2-asv.R threads (also the tree step's); --threads overrides; null: SLURM CPUs, else 4

locus_settings:
  16S:
    # 515F/806R V4; primers already removed by the sequencing facility in all three runs; 253-bp insert, so 2x300
    # reads run into the opposite primer (R1 hits 806R-rc at ~245): truncLen + trimOverhang (mergePairs), no cutadapt
    fwd_primer: GTGYCAGCMGCCGCGGTAA
    rev_primer: GGACTACNVGGGTWTCTAAT
    run_cutadapt: false
    merge: true
    truncLen: [240, 180]                # default for runs not listed under runs
    maxEE: [2, 2]
    # per-run truncLen from the quality profiles (16S/qc/NEON_16S_quality_by_run.pdf, 5 samples per run): R1 is good to
    # ~240 in all runs; R2 drops much earlier in 2018 (mean < Q30 from cycle 119) than in 2022 LHM22 (198). The overlap
    # on the 253-bp amplicon stays >= 137 bp, and merged pairs span the whole amplicon, so ASVs stay comparable.
    runs:
      batch1_2018_M02248_JL579: {truncLen: [240, 150]}
      batch2_2022_M02248_LHM22: {truncLen: [240, 190]}
      Reyesmixed16SITS_run_redos: {truncLen: [240, 160]}
    asv_lengths: [250, 256]             # V4 "cut a band" window
    taxonomy:
      db: "{refdir}/dada2/SILVA/v144/silva_nr99_v144_toGenus_trainset.fa.gz"
      species_db: "{refdir}/dada2/SILVA/v144/silva_v144_assignSpecies.fa.gz"
      levels: [Domain, Kingdom, Phylum, Class, Order, Family, Genus]
      try_rc: false
    remove_taxa: {Order: [Chloroplast], Family: [Mitochondria]}
    require_ranks: [Phylum]
    tree:
      method: mothur-v4                 # align-asv-v4.sh: SILVA V4 reference alignment + FastTree
      reference: "{mothur_ref}"         # holds silva.nr_v138_2.tgz (+ the V4 alignment, already built)
      v4_start: 13862
      v4_end: 23444
  ITS:
    # ITS1F/ITS2; the 5' primers are already removed, but reads run into the opposite primer (R1 hits ITS2-rc),
    # so cutadapt trims the read-through. R1 only: 2018 R2 (JL4PT) has N calls at many early cycles.
    fwd_primer: CTTGGTCATTTAGAGGAAGTAA
    rev_primer: GCTGCGTTCTTCATCGATGC
    run_cutadapt: true
    merge: false
    truncLen: [0]
    # 2018 R1 has an N at cycle 10 in ~58% of reads (and cycle 14 in ~4%); maxN = 0 would drop them. Trim the
    # first 14 bases in all samples, so 2018 and 2022 ASVs start at the same position
    trimLeft: [14]
    # Reads with no read-through (ITS1 longer than the read; ~19% of 2018 and ~27% of 2022 R1) keep every cycle:
    # 301 in the 2018 and 2024 runs, 300 in 2022. After trimLeft 14 the same long-ITS1 sequence then becomes a 287-bp
    # ASV in 2018 and a 286-bp ASV in 2022, so those taxa never match across years (first run: 2,902 287-bp ASVs only
    # in 2018, 9,322 286-bp ASVs only in 2022; 1,491 of the 287-bp ASVs equal a 286-bp ASV plus one base).
    # cutadapt --length 300 cuts every read to at most 300 after read-through removal; shorter reads are unchanged.
    max_read_length: 300
    maxEE: [2, 5]                       # R2 value used only when merging
    asv_lengths: null
    taxonomy:
      # UNITE 10.0 general release, all eukaryotes
      db: "{refdir}/dada2/UNITE_ITS/2025-02-19/sh_general_release_dynamic_all_19.02.2025_dev.fasta"
      unite_doi: 10.15156/BIO/3301231
      unite_dir: "{refdir}/dada2"
      species_db: null
      levels: [Kingdom, Phylum, Class, Order, Family, Genus, Species]
      try_rc: true
    # phyloseq.filtered.rds keeps Kingdom Fungi only (UNITE all-eukaryote release): drops Rhizaria (mostly Cercozoa),
    # plants, animals, other protists and kingdom-unassigned ASVs, ~5.9% of reads in total. The full set stays in
    # phyloseq.rds / ASVtable / taxonomy; what was removed is listed in <key>.taxa_filter.txt
    keep_taxa: {Kingdom: [Fungi]}
    # guilds step: FungalTraits 1.2 (genus lifestyles and traits) and FUNGuild (guilds with confidence), matched to
    # the UNITE taxonomy; tables made by get-guild-dbs.py (the reference step downloads them into dir if missing)
    guilds:
      dir: "{refdir}/guilds/2026-11-09"
      fungaltraits: "{refdir}/guilds/2026-11-09/FungalTraits_1.2.tsv"
      funguild: "{refdir}/guilds/2026-11-09/FUNGuild.tsv"
    remove_taxa: {}
    require_ranks: []
    tree: {method: none}

# ---- SLURM (workflow.py run --slurm) ----
slurm:
  account: m5259
  constraint: cpu
  qos: regular
  nodes: 1
  cpus: 128
  time: "12:00:00"                      # ~490 samples per locus
  setup: |
    module load conda
    conda activate itag
